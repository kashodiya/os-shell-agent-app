<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Shell Agent Chat</title>
    <!-- Vuetify -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.6.14/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github.min.css">
    <style>
        [v-cloak] { display: none; }
        .chat-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
            padding: 16px;
        }
        .message-bubble {
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #e0f7fa;
            margin-left: auto;
        }
        .agent-message {
            background-color: #f5f5f5;
            margin-right: auto;
        }
        .message-input {
            padding: 16px;
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: white;
        }
        .typing-indicator {
            display: inline-block;
            margin-left: 5px;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
            margin-right: 3px;
            animation: typing 1s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        pre {
            background-color: #f8f8f8;
            border-radius: 4px;
            padding: 10px;
            overflow-x: auto;
        }
        code {
            font-family: 'Courier New', Courier, monospace;
        }
        .markdown-content img {
            max-width: 100%;
        }
        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
        }
        .markdown-content th, .markdown-content td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        .markdown-content th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <v-app>
            <v-app-bar app color="primary" dark>
                <v-toolbar-title>OS Shell Agent Chat</v-toolbar-title>
                <v-spacer></v-spacer>
                <v-btn icon @click="toggleTheme">
                    <v-icon>{{ isDarkTheme ? 'mdi-weather-sunny' : 'mdi-weather-night' }}</v-icon>
                </v-btn>
            </v-app-bar>

            <v-main>
                <v-container fluid>
                    <router-view></router-view>
                </v-container>
            </v-main>
        </v-app>
    </div>

    <!-- Chat Template -->
    <script type="text/x-template" id="chat-template">
        <div>
            <div class="chat-container" ref="chatContainer">
                <div v-for="(message, index) in messages" :key="index">
                    <v-row no-gutters>
                        <v-col cols="12">
                            <div class="message-bubble" :class="message.sender === 'user' ? 'user-message' : 'agent-message'">
                                <div v-if="message.sender === 'user'">
                                    {{ message.content }}
                                </div>
                                <div v-else class="markdown-content" v-html="renderMarkdown(message.content)"></div>
                            </div>
                        </v-col>
                    </v-row>
                </div>
                <div v-if="isTyping" class="message-bubble agent-message">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
            <v-footer app class="message-input">
                <v-text-field
                    v-model="newMessage"
                    label="Type your message"
                    outlined
                    dense
                    @keyup.enter="sendMessage"
                    :disabled="isTyping"
                    append-icon="mdi-send"
                    @click:append="sendMessage"
                ></v-text-field>
            </v-footer>
        </div>
    </script>

    <!-- About Template -->
    <script type="text/x-template" id="about-template">
        <v-card class="mx-auto my-4" max-width="800">
            <v-card-title>About OS Shell Agent</v-card-title>
            <v-card-text>
                <p>This application provides a chat interface to interact with an OS Shell Agent.</p>
                <p>You can ask the agent to perform various tasks on your system using natural language.</p>
                <p>The agent can:</p>
                <ul>
                    <li>Execute shell commands</li>
                    <li>Manage files and directories</li>
                    <li>Provide system information</li>
                    <li>And much more!</li>
                </ul>
            </v-card-text>
            <v-card-actions>
                <v-spacer></v-spacer>
                <v-btn color="primary" text to="/">Go to Chat</v-btn>
            </v-card-actions>
        </v-card>
    </script>

    <!-- Vue, Vuetify, Vue-Router, Marked (for Markdown) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.6.14/dist/vuetify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@3.5.3/dist/vue-router.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.18/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.3.8/dist/purify.min.js"></script>

    <script>
        // Configure marked with highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });

        // Chat component
        const Chat = {
            template: '#chat-template',
            data() {
                return {
                    messages: [],
                    newMessage: '',
                    isTyping: false,
                    socket: null,
                    clientId: '',
                    currentStreamedMessage: ''
                };
            },
            mounted() {
                this.initWebSocket();
                this.scrollToBottom();
            },
            updated() {
                this.scrollToBottom();
            },
            methods: {
                initWebSocket() {
                    this.clientId = this.generateClientId();
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws/${this.clientId}`;
                    
                    this.socket = new WebSocket(wsUrl);
                    
                    this.socket.onopen = () => {
                        console.log('WebSocket connection established');
                    };
                    
                    this.socket.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'stream') {
                            if (!this.isTyping) {
                                this.isTyping = true;
                                this.currentStreamedMessage = '';
                                this.messages.push({
                                    sender: 'agent',
                                    content: this.currentStreamedMessage
                                });
                            }
                            
                            this.currentStreamedMessage += data.content;
                            this.messages[this.messages.length - 1].content = this.currentStreamedMessage;
                        } else if (data.type === 'complete') {
                            this.isTyping = false;
                        }
                    };
                    
                    this.socket.onclose = () => {
                        console.log('WebSocket connection closed');
                        // Try to reconnect after a delay
                        setTimeout(() => this.initWebSocket(), 3000);
                    };
                    
                    this.socket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };
                },
                
                sendMessage() {
                    if (!this.newMessage.trim() || this.isTyping) return;
                    
                    const message = {
                        type: 'message',
                        content: this.newMessage
                    };
                    
                    this.messages.push({
                        sender: 'user',
                        content: this.newMessage
                    });
                    
                    this.socket.send(JSON.stringify(message));
                    this.newMessage = '';
                    this.isTyping = true;
                },
                
                renderMarkdown(text) {
                    // Use DOMPurify to sanitize the HTML from marked
                    return DOMPurify.sanitize(marked.parse(text));
                },
                
                scrollToBottom() {
                    if (this.$refs.chatContainer) {
                        this.$nextTick(() => {
                            this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
                        });
                    }
                },
                
                generateClientId() {
                    return 'client-' + Math.random().toString(36).substr(2, 9);
                }
            }
        };

        // About component
        const About = {
            template: '#about-template'
        };

        // Router configuration
        const router = new VueRouter({
            mode: 'history',
            routes: [
                { path: '/', component: Chat },
                { path: '/about', component: About }
            ]
        });

        // Vue app
        new Vue({
            el: '#app',
            vuetify: new Vuetify({
                theme: {
                    dark: localStorage.getItem('darkTheme') === 'true',
                }
            }),
            router,
            data: {
                isDarkTheme: localStorage.getItem('darkTheme') === 'true'
            },
            methods: {
                toggleTheme() {
                    this.$vuetify.theme.dark = !this.$vuetify.theme.dark;
                    this.isDarkTheme = this.$vuetify.theme.dark;
                    localStorage.setItem('darkTheme', this.isDarkTheme);
                }
            }
        });
    </script>
</body>
</html>
